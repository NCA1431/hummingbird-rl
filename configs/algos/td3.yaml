# TD3 with the settings of Fujimoto et al. (2018), as in SB3.
n_envs: 1
learning_rate: 1.0e-3
buffer_size: 1000000
learning_starts: 10000
batch_size: 256
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
policy_delay: 2
target_policy_noise: 0.2
target_noise_clip: 0.5
action_noise_std: 0.1     # Gaussian exploration noise on the actions
policy_kwargs:
  net_arch: [256, 256]
