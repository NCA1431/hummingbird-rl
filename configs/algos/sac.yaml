# SAC with the standard settings of the original paper and SB3.
n_envs: 1
learning_rate: 3.0e-4
buffer_size: 1000000
learning_starts: 10000    # random actions first, to fill the replay buffer
batch_size: 256
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: auto            # the temperature is learned to reach a target entropy
policy_kwargs:
  net_arch: [256, 256]
