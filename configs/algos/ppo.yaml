# PPO, close to the usual settings for continuous control (Stable-Baselines3 zoo, CleanRL).
# Always trained on the CPU: with small networks the GPU only adds transfer overhead.
n_envs: 8                 # parallel copies of the environment
n_steps: 512              # steps per env per update -> 4096 samples per update
batch_size: 256
n_epochs: 10
learning_rate: 3.0e-4
anneal_lr: true           # decrease linearly to 0 (CleanRL's default); pilot 2: hover 94% at the end vs 80% without
gamma: 0.99               # at 60 decisions per second this looks about 1.7 s ahead
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
normalize_reward: true    # rewards differ a lot in scale between tasks; observations are already scaled
policy_kwargs:
  net_arch: {pi: [256, 256], vf: [256, 256]}
  activation_fn: tanh
  log_std_init: -1.0      # initial action noise std 0.37 instead of 1: pure noise crashes the bird at once
