<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hummingbird RL</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfe9f3;
        font-family: system-ui, sans-serif;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        max-width: min(560px, calc(100% - 24px));
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.85);
        color: #1d2733;
        font-size: 14px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
